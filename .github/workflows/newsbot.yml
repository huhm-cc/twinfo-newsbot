name: newsbot
on:
  schedule:
    - cron: '3-59/10 * * * *'   # 每 10 分鐘（避開整點高峰；2026-11-22 重新註冊排程）
  workflow_dispatch:
    inputs:
      max_articles:
        description: '這次最多改寫幾則'
        required: false
        default: '2'
permissions:
  contents: read
  id-token: write   # 向 twinfo.huhm.cc 證明身分（GitHub OIDC，不需要 repo secret）
concurrency:
  group: newsbot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 抓新聞、改寫、送到網站
        env:
          NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
          MAX_ARTICLES: ${{ github.event.inputs.max_articles || '2' }}
          DAILY_CAP: '80'
        run: python newsbot.py
